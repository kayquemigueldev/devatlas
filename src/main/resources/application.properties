spring.application.name=devatlas

github.token=${GITHUB_TOKEN:}
github.client.connect-timeout=5s
github.client.read-timeout=10s

spring.datasource.url=${DB_URL:jdbc:h2:file:./data/devatlas;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

spring.cache.type=caffeine
spring.cache.cache-names=github-users,github-repositories,github-readmes,github-commits
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=600s

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

management.info.env.enabled=true
info.app.name=DevAtlas
info.app.description=Intelligent GitHub profile analyzer

server.port=${PORT:8080}
server.shutdown=graceful
server.forward-headers-strategy=native

spring.lifecycle.timeout-per-shutdown-phase=20s