spring.application.name=devatlas-test

github.token=
github.client.connect-timeout=5s
github.client.read-timeout=10s

spring.datasource.url=jdbc:h2:mem:devatlas-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

spring.cache.type=none